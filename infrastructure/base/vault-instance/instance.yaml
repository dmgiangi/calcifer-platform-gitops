apiVersion: vault.banzaicloud.com/v1alpha1
kind: Vault
metadata:
  name: vault
  namespace: vault
spec:
  size: 2
  image: hashicorp/vault:1.15.2

  serviceAccount: vault

  vaultLabels:
    azure.workload.identity/use: "true"

  unsealConfig:
    azure:
      keyVaultName: "kv-calcifer-westeurope"
      tenantId: "6ab554b0-ff6e-47a0-986c-3bad955c4694"

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "local-path"
        resources:
          requests:
            storage: 5Gi

  config:
    storage:
      raft:
        path: "/vault/data"
    listener:
      tcp:
        address: "0.0.0.0:8200"
        tls_disable: true
    ui: true
    api_addr: "http://vault.vault:8200"
    cluster_addr: "http://$(HOSTNAME).vault-internal:8201"

  externalConfig:
    policies:
      - name: allow_secrets
        rules: path "secret/*" { capabilities = ["create", "read", "update", "delete", "list"] }