apiVersion: vault.banzaicloud.com/v1alpha1
kind: Vault
metadata:
  name: vault
  namespace: vault
spec:
  size: 1
  image: hashicorp/vault:1.15.2

  # Template for the Service created by the Operator
  serviceTemplate:
    metadata:
      annotations:
        konghq.com/protocol: "https"
        konghq.com/tls-skip-verify: "true"

  # Service Account
  serviceAccount: vault

  # Azure Webhook Label
  vaultLabels:
    azure.workload.identity/use: "true"

  # Azure Unseal
  unsealConfig:
    azure:
      keyVaultName: "kv-calcifer-westeurope"

  # Physical Storage
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "local-path"
        resources:
          requests:
            storage: 5Gi

  #Mount Storage
  vaultContainerSpec:
    name: vault
    env:
      - name: SKIP_SETCAP
        value: "true"
      - name: SKIP_CHOWN
        value: "true"
    args: [ "server" ]
    volumeMounts:
      - name: data
        mountPath: /vault/data
      - name: vault-config
        mountPath: /vault/config
      - name: vault-tls
        mountPath: /vault/tls
    livenessProbe:
      httpGet:
        path: /v1/sys/health?standbyok=true
        port: 8200
        scheme: HTTPS
      failureThreshold: 3
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 1
    readinessProbe:
      httpGet:
        path: /v1/sys/health?standbyok=true&perfstandbyok=true&drsecondarycode=299
        port: 8200
        scheme: HTTPS
      failureThreshold: 2
      periodSeconds: 5
      successThreshold: 1
      timeoutSeconds: 1

  # internal config
  config:
    storage:
      raft:
        path: "/vault/data"
    listener:
      tcp:
        address: "0.0.0.0:8200"
        tls_disable: false
        tls_cert_file: "/vault/tls/server.crt"
        tls_key_file: "/vault/tls/server.key"
    ui: true
    disable_mlock: true
    api_addr: "https://vault.vault:8200"
    cluster_addr: "https://vault.vault:8201"

  vaultPodSpec:
    securityContext:
      runAsUser: 100
      runAsGroup: 1000
      fsGroup: 1000

  externalConfig:
    policies:
      - name: allow_secrets
        rules: path "secret/*" { capabilities = ["create", "read", "update", "delete", "list"] }