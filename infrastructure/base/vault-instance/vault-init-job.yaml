apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-generator
  namespace: vault
  annotations:
    vault.hashicorp.com/role: "secret-generator-role"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-secrets
  namespace: vault
  annotations:
    kustomize.toolkit.fluxcd.io/prune: "disabled"
spec:
  template:
    metadata:
      annotations:
        # We inject the Vault Agent ONLY to handle authentication
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "secret-generator-role"
        # We don't inject secrets; we use the token to WRITE them
        vault.hashicorp.com/agent-pre-populate-only: "true"
    spec:
      serviceAccountName: secret-generator
      restartPolicy: OnFailure
      containers:
        - name: generator
          image: hashicorp/vault:1.15
          command: ["/bin/sh", "-c"]
          args:
            - |
              # 1. Wait for Vault Agent to authenticate
              echo "Waiting for Vault Token..."
              while [! -f /vault/secrets/token ]; do sleep 1; done
              export VAULT_TOKEN=$(cat /vault/secrets/token)
              export VAULT_ADDR="http://vault.vault-system.svc.cluster.local:8200"

              # Function to generate and write secret safely
              generate_secret() {
                local path=$1
                local key=$2
                
                # Generate a 32-character alphanumeric password
                local pass=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)
                
                echo "Attempting to create secret at $path..."
                
                # -cas=0 ensures we ONLY write if the secret does not exist.
                # If it exists, this command fails safely, preserving the old password.
                vault kv put -cas=0 "$path" "$key=$pass"
                
                if [ $? -eq 0 ]; then
                  echo "✅ Secret created: $path"
                else
                  echo "⏭️  Secret already exists (CAS check), skipping: $path"
                fi
              }

              # --- POSTGRES SECRETS ---
              # We create separate secrets for admin and user to mimic granular access
              generate_secret "secret/infrastructure/postgresql" "postgres-password"
              generate_secret "secret/infrastructure/postgresql" "app-password"

              # --- KEYCLOAK SECRETS ---
              # Keycloak needs the same DB password generated above. 
              # In a real scenario, you might read the existing one or structure secrets differently.
              # For simplicity, we assume the Keycloak 'config' secret holds all its needs.
              
              # Read the Postgres App password we just ensured exists
              PG_PASS=$(vault kv get -field=app-password secret/infrastructure/postgresql)
              
              # Generate Keycloak Admin Password
              KC_ADM=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)
              
              echo "Writing Keycloak compound secret..."
              # Note: For the compound secret, we use cas=0 on the whole object.
              # If you need to update partial keys, you'd use 'vault kv patch'
              vault kv put -cas=0 secret/applications/keycloak \
                db_password="$PG_PASS" \
                admin_password="$KC_ADM"