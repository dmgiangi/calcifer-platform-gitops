apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-operator
  namespace: flux-system
spec:
  interval: 10m0s
  prune: true
  sourceRef:
    kind: GitRepository
    name: keycloak-k8s-resources
    namespace: flux-system
  path: "./kubernetes"
  targetNamespace: keycloak
  postBuild:
    substitute:
      NAMESPACE: keycloak