---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kong-gateway
  namespace: flux-system
spec:
  dependsOn:
    - name: metallb-config  # Kong needs MetalLB to be ready for LoadBalancer
  interval: 5m
  path: ./infrastructure/home/kong-gateway-resources
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  timeout: 5m

