apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: keycloak
spec:
  interval: 1h
  chart:
    spec:
      chart: postgresql
      version: 18.1.15
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    image:
      registry: public.ecr.aws
      repository: bitnami/postgresql
      tag: "16"
    auth:
      database: keycloak
      username: keycloak
      usePasswordFiles: true
      # PLACEHOLDER: Required to pass Helm chart validation checks (NOTES.txt).
      # The actual authentication is handled via the file injected by Vault.
      password: "placeholder-password-managed-by-vault"
      postgresPassword: "placeholder-admin-password-managed-by-vault"
    primary:
      persistence:
        enabled: true
        size: 8Gi
      # Configure the container to look for the password in the Vault-injected file
      extraEnvVars:
        - name: POSTGRES_PASSWORD_FILE
          value: /vault/secrets/credentials
      podAnnotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak"
        # Inject the secret into /vault/secrets/credentials
        vault.hashicorp.com/agent-inject-secret-credentials: "secret/data/keycloak/database"
        # Template: Only output the password value, no keys
        vault.hashicorp.com/agent-inject-template-credentials-left-delimiter: "[["
        vault.hashicorp.com/agent-inject-template-credentials-right-delimiter: "]]"
        vault.hashicorp.com/agent-inject-template-credentials: |
          [[- with secret "secret/data/keycloak/database" -]]
          [[ .Data.data.password ]]
          [[- end -]]