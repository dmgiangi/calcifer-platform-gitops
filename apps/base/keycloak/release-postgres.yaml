apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: keycloak
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: iam-stack
spec:
  releaseName: postgresql
  targetNamespace: keycloak
  interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  # OCI Chart Reference
  chart:
    spec:
      chart: postgresql
      version: 18.1.15
      sourceRef:
        kind: HelmRepository
        name: bitnami-oci
        namespace: flux-system
      interval: 1h

  values:
    # AUTH: Dummy Credentials to pass Bitnami Chart Validation.
    # IMPORTANT: In the standalone chart, these MUST be at the root 'auth' level.
    # These values satisfy Helm linting but are overridden by 'extraEnvVars' below.
    auth:
      username: "keycloak"
      password: "placeholder-user-password-for-validation"
      postgresPassword: "placeholder-admin-password-for-validation"
      database: "keycloak_db"

    # ARCHITECTURE: Standalone (for simplicity, HA chart follows similar patterns)
    architecture: standalone

    # POD CONFIGURATION: Primary Node
    primary:
      # ANNOTATIONS: Vault Agent Injection
      podAnnotations:
        # Enable the Vault Agent Sidecar
        vault.hashicorp.com/agent-inject: "true"
        # Specify the Vault Role bound to the ServiceAccount
        vault.hashicorp.com/role: "postgresql-role"

        # INJECTION: Postgres Admin Password
        # Target path: /vault/secrets/postgres-password
        vault.hashicorp.com/agent-inject-secret-postgres-password: "secret/data/infrastructure/postgresql"
        # TEMPLATE: Use custom delimiters [[ ]] to avoid Helm conflict
        vault.hashicorp.com/agent-inject-template-postgres-password: |
          [[ with secret "secret/data/infrastructure/postgresql" ]]
          [[ end ]]

        # INJECTION: Application User (Keycloak) Password
        # Target path: /vault/secrets/app-password
        vault.hashicorp.com/agent-inject-secret-app-password: "secret/data/infrastructure/postgresql"
        vault.hashicorp.com/agent-inject-template-app-password: |
          [[ with secret "secret/data/infrastructure/postgresql" ]]
          [[ end ]]

        # DELIMITER CONFIGURATION
        vault.hashicorp.com/agent-template-left-delim: "[["
        vault.hashicorp.com/agent-template-right-delim: "]]"

      # RUNTIME OVERRIDES: Pointing Bitnami to the injected files
      # We use the standard Bitnami _FILE convention for Postgres 16+
      extraEnvVars:
        # 1. Admin 'postgres' user password
        - name: POSTGRESQL_POSTGRES_PASSWORD_FILE
          value: /vault/secrets/postgres-password

        # 2. Custom 'keycloak' user password
        # When a custom user is defined, POSTGRESQL_PASSWORD applies to that user.
        - name: POSTGRESQL_PASSWORD_FILE
          value: /vault/secrets/app-password

        # 3. Safety: Allow empty passwords during the initial check
        # (This prevents the script from exiting before it reads the _FILE vars)
        - name: ALLOW_EMPTY_PASSWORD
          value: "yes"

    # PERSISTENCE: Standard configuration
    persistence:
      enabled: true
      size: 8Gi
      accessModes:
        - ReadWriteOnce

    # NETWORKING
    service:
      type: ClusterIP
      ports:
        postgresql: 5432