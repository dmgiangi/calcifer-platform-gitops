apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: database
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: iam-stack
spec:
  releaseName: postgresql
  targetNamespace: database
  interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  # OCI Chart Reference
  chart:
    spec:
      chart: postgresql
      version: 18.1.15
      sourceRef:
        kind: HelmRepository
        name: bitnami-oci
        namespace: flux-system
      interval: 1h

  values:
    # GLOBAL: Dummy Credentials to pass Bitnami Chart Validation
    # These values are required by the chart's strict schema validation but will be overridden at runtime.
    global:
      postgresql:
        auth:
          postgresPassword: "placeholder-admin-password-for-validation"
          username: "keycloak"
          password: "placeholder-user-password-for-validation"
          database: "keycloak_db"

    # ARCHITECTURE: Standalone (for simplicity, HA chart follows similar patterns)
    architecture: standalone

    # POD CONFIGURATION: Primary Node
    primary:
      # ANNOTATIONS: Vault Agent Injection
      podAnnotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak"
        vault.hashicorp.com/agent-run-as-user: "1001"
        vault.hashicorp.com/agent-run-as-group: "1001"
        # Inject the secret into /vault/secrets/credentials
        vault.hashicorp.com/agent-inject-secret-credentials: "secret/data/keycloak/database"

        # INJECTION: Postgres Admin Password
        # Target path: /vault/secrets/postgres-password
        vault.hashicorp.com/agent-inject-secret-postgres-password: "secret/data/infrastructure/postgresql"
        # TEMPLATE: Use custom delimiters [[ ]] to avoid Helm conflict
        vault.hashicorp.com/agent-inject-template-postgres-password: |
          [[ with secret "secret/data/infrastructure/postgresql" ]]
          [[ end ]]

        # INJECTION: Application User Password
        # Target path: /vault/secrets/app-password
        vault.hashicorp.com/agent-inject-secret-app-password: "secret/data/infrastructure/postgresql"
        vault.hashicorp.com/agent-inject-template-app-password: |
          [[ with secret "secret/data/infrastructure/postgresql" ]]
         ]
          [[ end ]]

        # DELIMITER CONFIGURATION
        vault.hashicorp.com/agent-template-left-delim: "[["
        vault.hashicorp.com/agent-template-right-delim: "]]"

      # RUNTIME OVERRIDES: Pointing Bitnami to the injected files
      extraEnvVars:
        # Override the dummy admin password
        - name: POSTGRES_PASSWORD_FILE
          value: /vault/secrets/postgres-password
        # Override the dummy app user password
        - name: POSTGRES_POSTGRES_PASSWORD_FILE
          value: /vault/secrets/app-password
        # Override the dummy app user password (alternative variable name depending on specific bitnami version logic)
        - name: PASSWORD_FILE
          value: /vault/secrets/app-password
        # Explicitly allow empty password env vars since we are using files
        - name: ALLOW_EMPTY_PASSWORD
          value: "yes"

    # PERSISTENCE: Standard configuration
    persistence:
      enabled: true
      size: 8Gi
      accessModes:
        - ReadWriteOnce

    # NETWORKING
    service:
      type: ClusterIP
      ports:
        postgresql: 5432