apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: keycloak
spec:
  interval: 1h
  chart:
    spec:
      chart: postgresql
      version: 15.5.31
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    auth:
      database: keycloak
      username: keycloak
      # Password authentication is delegated to the file injected by Vault
      usePasswordFiles: true
    primary:
      persistence:
        enabled: true
        size: 8Gi
      # Configure the container to look for the password in the Vault-injected file
      extraEnvVars:
        - name: POSTGRES_PASSWORD_FILE
          value: /vault/secrets/credentials
      podAnnotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak"
        # Inject the secret into /vault/secrets/credentials
        vault.hashicorp.com/agent-inject-secret-credentials: "secret/data/keycloak/database"
                # Template: Only output the password value, no keys
                vault.hashicorp.com/agent-inject-template-credentials: |
                  {{ "{{" }}- with secret "secret/data/keycloak/database" -{{ "}}" }}
                  {{ "{{" }} .Data.data.password {{ "}}" }}
                  {{ "{{" }}- end -{{ "}}" }}
        