apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak
spec:
  interval: 10m0s
  chart:
    spec:
      chart: keycloak
      version: "25.x.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 1h0m0s
  values:
    auth:
      adminUser: admin
      existingSecret: keycloak-credentials
      passwordSecretKey: admin-password

    # Database Configuration (bundled PostgreSQL)
    postgresql:
      enabled: true
      auth:
        # Reference the same secret for database credentials
        existingSecret: keycloak-credentials
        # Key in the secret for the postgres admin password
        secretKeys:
          adminPasswordKey: postgres-password
          userPasswordKey: password
      # Persistence configuration (optional but recommended)
      primary:
        persistence:
          enabled: true
          size: 8Gi

    # Service Configuration (expose Keycloak)
    service:
      type: ClusterIp
      ports:
        http: 80