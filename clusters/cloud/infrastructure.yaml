---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./infrastructure/cloud
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age

